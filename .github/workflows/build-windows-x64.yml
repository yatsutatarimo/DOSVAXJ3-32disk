name: Build DOSVAXJ3 x64 (32 floppy slots)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify 32-disk patch
        shell: pwsh
        run: |
          $text = Get-Content include\bios_disk.h -Raw
          if ($text -notmatch '#define\s+MAX_SWAPPABLE_DISKS\s+32') {
            throw 'MAX_SWAPPABLE_DISKS is not 32'
          }
          Write-Host '32 floppy slots confirmed.'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build SDL-IM-plus
        shell: pwsh
        run: |
          $libRoot = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) 'Lib'
          New-Item -ItemType Directory -Force -Path $libRoot | Out-Null

          $sdl = Join-Path $libRoot 'SDL-IM-plus'
          git clone --depth 1 https://github.com/nanshiki/SDL-IM-plus.git $sdl

          $sln = Join-Path $sdl 'VisualC\SDL.sln'
          msbuild $sln /m /p:Configuration=Release /p:Platform=x64

          Write-Host 'SDL build completed.'

      - name: Configure minimal J3100 build
        shell: pwsh
        run: |
          # ---------------------------------------------------------
          # Disable optional components not required for J3100 work.
          # Keep Windows clipboard without PDCurses.
          # ---------------------------------------------------------
          $config = 'src\platform\visualc\config.h'
          $text = Get-Content $config -Raw

          $text = $text -replace '#define C_SSHOT 1',  '#define C_SSHOT 0'
          $text = $text -replace '#define C_SRECORD 1','#define C_SRECORD 0'
          $text = $text -replace '#define C_MODEM 1',  '#define C_MODEM 0'
          $text = $text -replace '#define C_IPX 1',    '#define C_IPX 0'

          if ($text -notmatch '#define C_NOPDCLIP 1') {
            $text = $text -replace '#define C_CLIPBOARD 1',
              "#define C_CLIPBOARD 1`r`n#define C_NOPDCLIP 1"
          }

          Set-Content $config $text -Encoding ASCII

          # ---------------------------------------------------------
          # Patch Visual Studio project:
          #   Remove zlib, PNG, SDL_net and PDCurses dependencies.
          #   Keep only SDL/SDLmain plus Windows system libraries.
          # ---------------------------------------------------------
          $proj = 'visualc_net\dosbox.vcxproj'
          [xml]$xml = Get-Content $proj

          $ns = New-Object System.Xml.XmlNamespaceManager($xml.NameTable)
          $ns.AddNamespace('m','http://schemas.microsoft.com/developer/msbuild/2003')

          foreach ($node in $xml.SelectNodes('//m:AdditionalDependencies',$ns)) {
            $deps = $node.InnerText -split ';' |
              Where-Object {
                $_ -and
                $_ -notmatch '^(?i:zlib\.lib)$' -and
                $_ -notmatch '^(?i:libpng\.lib)$' -and
                $_ -notmatch '^(?i:sdl_net\.lib)$' -and
                $_ -notmatch '^(?i:pdcurses\.lib)$'
              }

            $node.InnerText = ($deps -join ';')
          }

          # SDL headers/libraries built in previous step
          $libRoot = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) 'Lib'
          $sdl = Join-Path $libRoot 'SDL-IM-plus'

          $sdlInclude = Join-Path $sdl 'include'
          $sdlLib     = Join-Path $sdl 'VisualC\x64\Release'
          $sdlMainLib = Join-Path $sdl 'VisualC\SDLmain\x64\Release'

          foreach ($node in $xml.SelectNodes('//m:IncludePath',$ns)) {
            $node.InnerText = "$sdlInclude;`$(IncludePath)"
          }

          foreach ($node in $xml.SelectNodes('//m:LibraryPath',$ns)) {
            $node.InnerText = "$sdlLib;$sdlMainLib;`$(LibraryPath)"
          }

          $xml.Save($proj)

          Write-Host 'Minimal build configuration applied.'
          Write-Host 'Disabled: screenshots, video recording, IPX, modem.'
          Write-Host 'Kept: J3100, disk emulation, parallel/serial core, Windows clipboard.'

      - name: Build DOSVAXJ3 Release x64
        shell: pwsh
        run: |
          msbuild visualc_net\dosbox.sln `
            /m `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform=x64

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem $env:GITHUB_WORKSPACE -Recurse -Filter dosboxj.exe |
            Select-Object -First 1

          if (-not $exe) {
            throw 'dosboxj.exe was not produced'
          }

          Write-Host "Built executable: $($exe.FullName)"
          Write-Host "Size: $($exe.Length) bytes"

      - name: Gather output
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'artifact'
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $exe = Get-ChildItem $env:GITHUB_WORKSPACE -Recurse -Filter dosboxj.exe |
            Select-Object -First 1
          Copy-Item $exe.FullName $out -Force

          foreach ($file in @(
            'visualc_net\dosboxj.conf',
            'visualc_net\japanese.lng',
            'visualc_net\jp.kl'
          )) {
            if (Test-Path $file) {
              Copy-Item $file $out -Force
            }
          }

          Write-Host 'Artifact contents:'
          Get-ChildItem $out

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DOSVAXJ3-x64-32disks
          path: artifact/*
          if-no-files-found: error
