name: Build DOSVAXJ3 x64 (32 floppy slots)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify 32-disk patch
        shell: pwsh
        run: |
          $text = Get-Content include\bios_disk.h -Raw
          if ($text -notmatch '#define\s+MAX_SWAPPABLE_DISKS\s+32') {
            throw 'include\\bios_disk.h is not patched to MAX_SWAPPABLE_DISKS 32'
          }

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Install dependency libraries with vcpkg
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install `
            sdl1-net:x64-windows-static `
            zlib:x64-windows-static `
            libpng:x64-windows-static `
            pdcurses:x64-windows-static

      - name: Build SDL-IM-plus
        shell: pwsh
        run: |
          $libRoot = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) 'Lib'
          New-Item -ItemType Directory -Force -Path $libRoot | Out-Null
          git clone --depth 1 https://github.com/nanshiki/SDL-IM-plus.git (Join-Path $libRoot 'SDL-IM-plus')
          $sln = Join-Path $libRoot 'SDL-IM-plus\VisualC\SDL.sln'
          msbuild $sln /m /p:Configuration=Release /p:Platform=x64

      - name: Collect headers and static/import libraries
        shell: pwsh
        run: |
          $deps = Join-Path $env:GITHUB_WORKSPACE 'builddeps'
          $inc  = Join-Path $deps 'include'
          $lib  = Join-Path $deps 'lib'
          New-Item -ItemType Directory -Force -Path $inc,$lib | Out-Null

          $triplet = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed\x64-windows-static'
          $vinc = Join-Path $triplet 'include'
          Copy-Item "$vinc\*" $inc -Recurse -Force

          $libRoot = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) 'Lib'
          $sdl = Join-Path $libRoot 'SDL-IM-plus'
          Copy-Item "$sdl\include\*" $inc -Recurse -Force

          function Copy-FirstLib([string[]]$patterns, [string]$destName) {
            foreach ($pattern in $patterns) {
              $f = Get-ChildItem -Path $pattern -File -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($f) {
                Copy-Item $f.FullName (Join-Path $lib $destName) -Force
                Write-Host "$destName <= $($f.FullName)"
                return
              }
            }
            throw "Could not find library for $destName"
          }

          Copy-FirstLib @(
            "$sdl\VisualC\x64\Release\SDL.lib",
            "$sdl\VisualC\SDL\x64\Release\SDL.lib",
            "$sdl\**\x64\Release\SDL.lib"
          ) 'sdl.lib'

          Copy-FirstLib @(
            "$sdl\VisualC\SDLmain\x64\Release_NOSTDIO\SDLmain.lib",
            "$sdl\VisualC\SDLmain\x64\Release\SDLmain.lib",
            "$sdl\**\x64\Release*\SDLmain.lib"
          ) 'sdlmain.lib'

          $vlib = Join-Path $triplet 'lib'
          Copy-FirstLib @("$vlib\SDL_net.lib", "$vlib\sdl_net.lib") 'sdl_net.lib'
          $zlibFile = Get-ChildItem -Path $triplet -Recurse -File |
            Where-Object {
              $_.Name -match '^zlib.*\.lib$' -and
              $_.FullName -notmatch '\\debug\\'
            } |
            Select-Object -First 1
          if (-not $zlibFile) {
            Write-Host 'Available zlib-related files:'
            Get-ChildItem -Path $triplet -Recurse -File |
              Where-Object { $_.Name -match 'zlib|zlibstatic' } |
              ForEach-Object { Write-Host $_.FullName }
            throw 'Could not find release zlib library'
          }
          Copy-Item $zlibFile.FullName (Join-Path $lib 'zlib.lib') -Force
          Write-Host "zlib.lib <= $($zlibFile.FullName)" 
          Copy-FirstLib @("$vlib\libpng16.lib", "$vlib\libpng.lib", "$vlib\*png*.lib") 'libpng.lib'
          Copy-FirstLib @("$vlib\pdcurses.lib", "$vlib\*pdcurses*.lib") 'pdcurses.lib'

          Write-Host 'Collected libraries:'
          Get-ChildItem $lib

      - name: Patch DOSVAXJ3 project paths for CI
        shell: pwsh
        run: |
          $proj = Join-Path $env:GITHUB_WORKSPACE 'visualc_net\dosbox.vcxproj'
          [xml]$xml = Get-Content $proj
          $ns = New-Object System.Xml.XmlNamespaceManager($xml.NameTable)
          $ns.AddNamespace('m', 'http://schemas.microsoft.com/developer/msbuild/2003')
          $inc = (Join-Path $env:GITHUB_WORKSPACE 'builddeps\include')
          $lib = (Join-Path $env:GITHUB_WORKSPACE 'builddeps\lib')
          foreach ($node in $xml.SelectNodes('//m:IncludePath', $ns)) {
            $node.InnerText = "$inc;`$(IncludePath)"
          }
          foreach ($node in $xml.SelectNodes('//m:LibraryPath', $ns)) {
            $node.InnerText = "$lib;`$(LibraryPath)"
          }
          $xml.Save($proj)

      - name: Build DOSVAXJ3 Release x64
        shell: pwsh
        run: |
          msbuild visualc_net\dosbox.sln /m /t:Build /p:Configuration=Release /p:Platform=x64

      - name: Gather output
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'artifact'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $exe = Get-ChildItem $env:GITHUB_WORKSPACE -Recurse -Filter dosboxj.exe | Select-Object -First 1
          if (-not $exe) { throw 'dosboxj.exe was not produced' }
          Copy-Item $exe.FullName $out -Force
          Copy-Item visualc_net\dosboxj.conf $out -Force
          Copy-Item visualc_net\japanese.lng $out -Force
          Copy-Item visualc_net\jp.kl $out -Force

          $libRoot = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) 'Lib'
          Get-ChildItem $libRoot -Recurse -Filter SDL.dll -ErrorAction SilentlyContinue | Select-Object -First 1 | ForEach-Object { Copy-Item $_.FullName $out -Force }
          Get-ChildItem $libRoot -Recurse -Filter SDL_net.dll -ErrorAction SilentlyContinue | Select-Object -First 1 | ForEach-Object { Copy-Item $_.FullName $out -Force }
          Write-Host "Output from: $($exe.FullName)"
          Get-ChildItem $out

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DOSVAXJ3-x64-32disks
          path: artifact\*
          if-no-files-found: error
